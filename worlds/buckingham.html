<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ארמון בקינגהאם - עולם תלת-ממדי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Assistant', sans-serif;
            background-color: #0f172a;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Custom Glassmorphism Scrollbar & Buttons */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .btn-royal {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-royal:hover {
            background: rgba(212, 175, 55, 0.25);
            border-color: rgba(255, 215, 0, 0.6);
            transform: translateY(-1px);
        }
        .btn-royal.active {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.85), rgba(180, 135, 30, 0.9));
            color: #0f172a;
            font-weight: 700;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        #loader {
            transition: opacity 0.7s ease-out, visibility 0.7s ease-out;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-amber-100">
        <div class="w-16 h-16 border-4 border-amber-400/30 border-t-amber-400 rounded-full animate-spin mb-4"></div>
        <h2 class="text-2xl font-bold tracking-wide text-amber-300">בונה את ארמון בקינגהאם...</h2>
        <p class="text-sm text-slate-400 mt-1">מכין את משמר המלכה, המזרקות והגנים המלכותיים</p>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top Header Overlay -->
    <header class="fixed top-4 right-4 left-4 z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pointer-events-none">
        <div class="glass-panel rounded-2xl px-5 py-3 pointer-events-auto max-w-md">
            <div class="flex items-center gap-2.5">
                <span class="text-2xl">👑</span>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-amber-300 leading-tight">ארמון בקינגהאם - עולם תלת-ממדי</h1>
                    <p class="text-xs md:text-sm text-slate-200/90 mt-0.5">
                        גרירה לסיבוב • גלגלת לזום • קליק ימני להזזה • מקשי <span class="text-amber-300 font-semibold">WASD</span> או חצים לטיול חופשי
                    </p>
                </div>
            </div>
        </div>

        <!-- Time of Day / Lighting Controls -->
        <div class="glass-panel rounded-2xl p-2 flex items-center gap-1.5 pointer-events-auto self-end md:self-auto">
            <button id="time-morning" class="btn-royal active px-3.5 py-2 rounded-xl text-xs md:text-sm text-white flex items-center gap-1.5 cursor-pointer">
                <span>☀️</span>
                <span>בוקר מלכותי</span>
            </button>
            <button id="time-sunset" class="btn-royal px-3.5 py-2 rounded-xl text-xs md:text-sm text-white flex items-center gap-1.5 cursor-pointer">
                <span>🌅</span>
                <span>שקיעה זהובה</span>
            </button>
            <button id="time-night" class="btn-royal px-3.5 py-2 rounded-xl text-xs md:text-sm text-white flex items-center gap-1.5 cursor-pointer">
                <span>🌙</span>
                <span>לילה מואר</span>
            </button>
        </div>
    </header>

    <!-- Bottom Camera Presets Bar -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-10 w-[94%] max-w-3xl pointer-events-none">
        <div class="glass-panel rounded-2xl p-2 flex flex-wrap justify-center items-center gap-2 pointer-events-auto">
            <button data-cam="panoramic" class="cam-btn btn-royal active px-3.5 py-2 rounded-xl text-xs md:text-sm text-white cursor-pointer">
                🏛️ מבט פנורמי
            </button>
            <button data-cam="memorial" class="cam-btn btn-royal px-3.5 py-2 rounded-xl text-xs md:text-sm text-white cursor-pointer">
                🗽 אנדרטת ויקטוריה
            </button>
            <button data-cam="facade" class="cam-btn btn-royal px-3.5 py-2 rounded-xl text-xs md:text-sm text-white cursor-pointer">
                👑 חזית הארמון
            </button>
            <button data-cam="guard" class="cam-btn btn-royal px-3.5 py-2 rounded-xl text-xs md:text-sm text-white cursor-pointer">
                💂 משמר המלכה
            </button>
            <button data-cam="aerial" class="cam-btn btn-royal px-3.5 py-2 rounded-xl text-xs md:text-sm text-white cursor-pointer">
                🦅 ממעוף הציפור
            </button>
        </div>
    </nav>

    <!-- Import Map for Three.js & Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        /**
         * Procedural Texture Generators
         * Generates Bath stone, cobblestone, grass, and the British Union Jack flag on HTML5 Canvases
         */
        function createStoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Base cream Bath-stone color
            ctx.fillStyle = '#e7dcc8';
            ctx.fillRect(0, 0, 512, 512);

            // Subtle stone grain noise
            for (let i = 0; i < 6000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const shade = Math.random() > 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(130,115,95,0.12)';
                ctx.fillStyle = shade;
                ctx.fillRect(x, y, 2, 2);
            }

            // Ashlar masonry blocks
            ctx.strokeStyle = 'rgba(145, 130, 110, 0.45)';
            ctx.lineWidth = 2;
            const rows = 8;
            const cols = 4;
            const rowH = 512 / rows;
            const colW = 512 / cols;

            for (let r = 0; r < rows; r++) {
                const y = r * rowH;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(512, y);
                ctx.stroke();

                const offset = (r % 2) * (colW / 2);
                for (let c = 0; c <= cols; c++) {
                    const x = (c * colW + offset) % 512;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + rowH);
                    ctx.stroke();
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(6, 3);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createCobbleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#8b8982';
            ctx.fillRect(0, 0, 512, 512);

            const step = 16;
            for (let y = 0; y < 512; y += step) {
                const offset = ((y / step) % 2) * (step / 2);
                for (let x = 0; x < 512; x += step) {
                    const v = 125 + Math.floor(Math.random() * 35);
                    ctx.fillStyle = `rgb(${v}, ${v - 2}, ${v - 6})`;
                    ctx.beginPath();
                    ctx.roundRect(x + offset + 1, y + 1, step - 2, step - 2, 3);
                    ctx.fill();
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(24, 24);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, 512, 512);

            // Mowed lawn stripes
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < 512; i += 64) {
                ctx.fillRect(i, 0, 32, 512);
            }

            for (let i = 0; i < 12000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                ctx.fillStyle = Math.random() > 0.5 ? '#3a7233' : '#21451c';
                ctx.fillRect(x, y, 2, 3);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(30, 30);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createUnionJackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            // Royal Blue background
            ctx.fillStyle = '#012169';
            ctx.fillRect(0, 0, 600, 300);

            // White diagonals
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 60;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(600, 300);
            ctx.moveTo(600, 0); ctx.lineTo(0, 300);
            ctx.stroke();

            // Red diagonals (St Patrick's Saltire)
            ctx.strokeStyle = '#C8102E';
            ctx.lineWidth = 22;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(600, 300);
            ctx.moveTo(600, 0); ctx.lineTo(0, 300);
            ctx.stroke();

            // White cross (St George fimbriation)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(250, 0, 100, 300);
            ctx.fillRect(0, 100, 600, 100);

            // Red cross (St George)
            ctx.fillStyle = '#C8102E';
            ctx.fillRect(270, 0, 60, 300);
            ctx.fillRect(0, 120, 600, 60);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Core Scene Variables
        let scene, camera, renderer, controls;
        let sunLight, hemiLight, ambientLight, skyDome, starsGroup;
        let flagMesh, flagGeo, flagBasePositions;
        let waterMesh, waterBaseY;
        let windowMaterials = [];
        let lanternLights = [];
        let floodLights = [];
        let marchingGuards = [];
        let carriageGroup, carriageWheels = [];
        let clock = new THREE.Clock();

        // Camera Tweening State
        let targetCamPos = null;
        let targetLookAt = null;

        // WASD Keyboard Input State
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

        // Camera Presets
        const CAMERA_PRESETS = {
            panoramic: { pos: new THREE.Vector3(0, 28, 125), target: new THREE.Vector3(0, 12, -20) },
            memorial:  { pos: new THREE.Vector3(24, 14, 72), target: new THREE.Vector3(0, 11, 44) },
            facade:    { pos: new THREE.Vector3(0, 15, 16),  target: new THREE.Vector3(0, 16, -42) },
            guard:     { pos: new THREE.Vector3(-14, 4.5, -16), target: new THREE.Vector3(-8, 3.2, -29) },
            aerial:    { pos: new THREE.Vector3(75, 85, 95), target: new THREE.Vector3(0, 5, 0) }
        };

        // Time of Day Configurations
        const TIME_MODES = {
            morning: {
                bg: 0x87ceeb,
                fog: 0xaad8f0,
                sunColor: 0xfff5e0,
                sunIntensity: 2.3,
                sunPos: new THREE.Vector3(60, 85, 65),
                hemiSky: 0x99d6ff,
                hemiGround: 0x5c6b4d,
                hemiIntensity: 0.9,
                windowGlow: 0.15,
                lampIntensity: 0,
                starsOpacity: 0,
                skyTop: new THREE.Color(0x2b7de9),
                skyBottom: new THREE.Color(0xcce8ff)
            },
            sunset: {
                bg: 0xe87a54,
                fog: 0xd97254,
                sunColor: 0xff8c42,
                sunIntensity: 2.5,
                sunPos: new THREE.Vector3(-90, 22, -40),
                hemiSky: 0xff9e6d,
                hemiGround: 0x3d2c3e,
                hemiIntensity: 0.75,
                windowGlow: 0.85,
                lampIntensity: 1.8,
                starsOpacity: 0.15,
                skyTop: new THREE.Color(0x3a245c),
                skyBottom: new THREE.Color(0xff8e53)
            },
            night: {
                bg: 0x070d1f,
                fog: 0x0b132b,
                sunColor: 0x8ab4f8,
                sunIntensity: 0.45,
                sunPos: new THREE.Vector3(-50, 70, 50),
                hemiSky: 0x1c2541,
                hemiGround: 0x0b132b,
                hemiIntensity: 0.35,
                windowGlow: 2.2,
                lampIntensity: 4.5,
                starsOpacity: 0.95,
                skyTop: new THREE.Color(0x030712),
                skyBottom: new THREE.Color(0x172554)
            }
        };

        // Shared Materials
        let stoneMat, trimMat, goldMat, darkIronMat, roofMat, marbleMat;

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene & Fog
            scene = new THREE.Scene();
            scene.background = new THREE.Color(TIME_MODES.morning.bg);
            scene.fog = new THREE.FogExp2(TIME_MODES.morning.fog, 0.0032);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 600);
            camera.position.copy(CAMERA_PRESETS.panoramic.pos);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.copy(CAMERA_PRESETS.panoramic.target);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent going under ground
            controls.minDistance = 8;
            controls.maxDistance = 240;

            // Cancel preset animation if user manually interacts
            controls.addEventListener('start', () => {
                targetCamPos = null;
                targetLookAt = null;
            });

            // 5. Initialize Materials
            const stoneTex = createStoneTexture();
            stoneMat = new THREE.MeshStandardMaterial({
                map: stoneTex,
                roughness: 0.72,
                metalness: 0.05
            });
            trimMat = new THREE.MeshStandardMaterial({
                color: 0xf4ebd9,
                roughness: 0.55,
                metalness: 0.05
            });
            goldMat = new THREE.MeshStandardMaterial({
                color: 0xffd15c,
                roughness: 0.22,
                metalness: 0.88
            });
            darkIronMat = new THREE.MeshStandardMaterial({
                color: 0x1a1d24,
                roughness: 0.4,
                metalness: 0.8
            });
            roofMat = new THREE.MeshStandardMaterial({
                color: 0x3b444b,
                roughness: 0.65,
                metalness: 0.2
            });
            marbleMat = new THREE.MeshStandardMaterial({
                color: 0xfbfaf5,
                roughness: 0.25,
                metalness: 0.08
            });

            // 6. Build World Components
            setupLightingAndSky();
            buildGroundAndGardens();
            buildBuckinghamPalace();
            buildPerimeterGates();
            buildVictoriaMemorial();
            buildRoyalGuards();
            buildRoyalCarriage();

            // 7. UI & Event Listeners
            setupUI();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
            window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

            // Hide Loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, 600);

            animate();
        }

        function setupLightingAndSky() {
            // Sky Dome with custom vertical gradient shader
            const skyGeo = new THREE.SphereGeometry(350, 32, 24);
            const skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                uniforms: {
                    topColor: { value: TIME_MODES.morning.skyTop.clone() },
                    bottomColor: { value: TIME_MODES.morning.skyBottom.clone() }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), 0.6), 0.0)), 1.0);
                    }
                `
            });
            skyDome = new THREE.Mesh(skyGeo, skyMat);
            scene.add(skyDome);

            // Stars for Night Mode
            const starsGeo = new THREE.BufferGeometry();
            const starCount = 1200;
            const starPos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const r = 310;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * (Math.PI * 0.48);
                starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = r * Math.cos(phi) + 10;
                starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, transparent: true, opacity: 0 });
            starsGroup = new THREE.Points(starsGeo, starsMat);
            scene.add(starsGroup);

            // Hemisphere Light
            hemiLight = new THREE.HemisphereLight(TIME_MODES.morning.hemiSky, TIME_MODES.morning.hemiGround, TIME_MODES.morning.hemiIntensity);
            scene.add(hemiLight);

            // Main Directional Sun/Moon Light
            sunLight = new THREE.DirectionalLight(TIME_MODES.morning.sunColor, TIME_MODES.morning.sunIntensity);
            sunLight.position.copy(TIME_MODES.morning.sunPos);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 260;
            const d = 105;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // Architectural Floodlights for Palace Facade at Night
            [-32, 0, 32].forEach(x => {
                const spot = new THREE.PointLight(0xffcf75, 0, 55, 1.4);
                spot.position.set(x, 3, -24);
                scene.add(spot);
                floodLights.push(spot);
            });
        }

        function buildGroundAndGardens() {
            const grassTex = createGrassTexture();
            const cobbleTex = createCobbleTexture();

            // Main Lush Green Lawn Base
            const groundGeo = new THREE.PlaneGeometry(600, 600);
            const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Paved Stone Forecourt inside the Palace Gates
            const forecourtGeo = new THREE.BoxGeometry(118, 0.2, 48);
            const cobbleMat = new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.78 });
            const forecourt = new THREE.Mesh(forecourtGeo, cobbleMat);
            forecourt.position.set(0, 0.1, -12);
            forecourt.receiveShadow = true;
            scene.add(forecourt);

            // Red-Tinted Ceremonial Road (The Mall & Roundabout around Memorial)
            const mallRoadMat = new THREE.MeshStandardMaterial({ color: 0x7c3f3b, roughness: 0.8 });
            const mallStrip = new THREE.Mesh(new THREE.BoxGeometry(28, 0.16, 220), mallRoadMat);
            mallStrip.position.set(0, 0.08, 120);
            mallStrip.receiveShadow = true;
            scene.add(mallStrip);

            // Circular Plaza around Victoria Memorial
            const plazaRing = new THREE.Mesh(new THREE.CylinderGeometry(36, 36, 0.18, 48), cobbleMat);
            plazaRing.position.set(0, 0.09, 44);
            plazaRing.receiveShadow = true;
            scene.add(plazaRing);

            // Manicured Flowerbeds & Topiary Hedges on Forecourt Corners & Gardens
            const hedgeMat = new THREE.MeshStandardMaterial({ color: 0x1e4d1b, roughness: 0.85 });
            const flowerColors = [0xd92638, 0xf4b41a, 0xffffff, 0xe85d75];

            const gardenZones = [
                { x: -46, z: 24, w: 18, d: 14 },
                { x: 46, z: 24, w: 18, d: 14 },
                { x: -46, z: 64, w: 18, d: 14 },
                { x: 46, z: 64, w: 18, d: 14 }
            ];

            gardenZones.forEach(zone => {
                // Boxwood border
                const border = new THREE.Mesh(new THREE.BoxGeometry(zone.w, 1.1, zone.d), hedgeMat);
                border.position.set(zone.x, 0.55, zone.z);
                border.castShadow = true;
                border.receiveShadow = true;
                scene.add(border);

                // Colorful Blooms inside
                for (let i = 0; i < 28; i++) {
                    const fCol = flowerColors[i % flowerColors.length];
                    const flower = new THREE.Mesh(
                        new THREE.SphereGeometry(0.45, 6, 6),
                        new THREE.MeshStandardMaterial({ color: fCol, roughness: 0.6 })
                    );
                    flower.position.set(
                        zone.x + (Math.random() - 0.5) * (zone.w - 2),
                        1.15,
                        zone.z + (Math.random() - 0.5) * (zone.d - 2)
                    );
                    scene.add(flower);
                }

                // Sculpted Cone Topiaries at corners
                [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dz]) => {
                    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.1, 3.6, 12), hedgeMat);
                    cone.position.set(zone.x + dx * (zone.w / 2), 1.8, zone.z + dz * (zone.d / 2));
                    cone.castShadow = true;
                    scene.add(cone);
                });
            });

            // Tree-lined Avenues (The Mall) & Victorian Street Lamps
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 });
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2a5c24, roughness: 0.8 });

        function createPediment(width, height, depth) {
            const shape = new THREE.Shape();
            shape.moveTo(-width / 2, 0);
            shape.lineTo(width / 2, 0);
            shape.lineTo(0, height);
            shape.closePath();

            const extrudeSettings = { depth: depth, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.2, bevelSegments: 2 };
            const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            geo.translate(0, 0, -depth / 2);
            const mesh = new THREE.Mesh(geo, trimMat);
            mesh.castShadow = true;
            return mesh;
        }

        function createCorinthianColumn(height) {
            const group = new THREE.Group();
            const base = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 1.3), trimMat);

            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, height - 1.8, 16), trimMat);

            group.add(shaft);

            const capital = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.48, 1.0, 12), goldMat);
            capital.position.y = height - 0.5;
            group.add(capital);

            return group;
        }

                if (idx % 2 === 0) {

                    scene.add(pLight);
                    lanternLights.push(pLight);

            // Wrought-Iron Fencing with Gold Tips between Piers
            const fenceSegments = [
                [-57, -37], [-35, -17], [-15, -7], [-5, 5], [7, 15], [17, 35], [37, 57]
            ];

            fenceSegments.forEach(([x1, x2]) => {
                const len = x2 - x1;
                const midX = (x1 + x2) / 2;
                const isCenterGate = Math.abs(midX) < 12;

                    tip.position.set(bx, barHeight + 0.18, gateZ);
                    scene.add(tip);
                }
            });

                scene.add(guard);
            });

            // 2. Two Marching Guard Patrols on the Forecourt
            const patrol1 = createRoyalGuardMesh();
            patrol1.position.set(-22, 0.2, -16);
            scene.add(patrol1);
            marchingGuards.push({ mesh: patrol1, minX: -36, maxX: -16, dir: 1, z: -16, phase: 0 });

            const patrol2 = createRoyalGuardMesh();
            patrol2.position.set(22, 0.2, -16);
            scene.add(patrol2);
            marchingGuards.push({ mesh: patrol2, minX: 16, maxX: 36, dir: -1, z: -16, phase: Math.PI });
        }

        function buildRoyalCarriage() {
            carriageGroup = new THREE.Group();
            carriageGroup.position.set(0, 0.18, 76);
            scene.add(carriageGroup);

            // Golden Ornate Coach Body
            const coachBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 4.4), goldMat);
            coachBody.position.y = 2.4;
            coachBody.castShadow = true;
            carriageGroup.add(coachBody);

            // Coach Windows
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.1, metalness: 0.9 });
            const sideWin = new THREE.Mesh(new THREE.BoxGeometry(2.46, 0.9, 2.2), glassMat);
            sideWin.position.y = 2.7;
            carriageGroup.add(sideWin);

            // Crown on Coach Roof
            const roofCrown = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), goldMat);
            roofCrown.position.y = 3.75;
            carriageGroup.add(roofCrown);

            // Four Spoked Wheels
            const wheelPositions = [
                [-1.35, 1.1, 1.5], [1.35, 1.1, 1.5],
                [-1.35, 1.35, -1.5], [1.35, 1.35, -1.5]
            ];
            wheelPositions.forEach(([wx, wy, wz]) => {
                const wheel = new THREE.Mesh(new THREE.TorusGeometry(wy, 0.12, 8, 20), goldMat);
                wheel.rotation.y = Math.PI / 2;
                wheel.position.set(wx, wy, wz);
                wheel.castShadow = true;
                carriageGroup.add(wheel);
                carriageWheels.push(wheel);
            });

            // Two White Royal Horses pulling the Carriage
            const horseMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.45 });
            [-0.75, 0.75].forEach(hx => {
                const horse = new THREE.Group();
                horse.position.set(hx, 0, 4.4);

                const body = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.85, 1.9), horseMat);
                body.position.y = 1.45;
                body.castShadow = true;
                horse.add(body);

                const neck = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.0, 0.5), horseMat);
                neck.position.set(0, 2.0, 0.85);
                neck.rotation.x = -0.35;
                horse.add(neck);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.42, 0.75), horseMat);
                head.position.set(0, 2.35, 1.15);
                horse.add(head);

                // 4 Legs
                [[-0.2, 0.7], [0.2, 0.7], [-0.2, -0.7], [0.2, -0.7]].forEach(([lx, lz]) => {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 1.1, 6), horseMat);
                    leg.position.set(lx, 0.55, lz);
                    horse.add(leg);
                });

                carriageGroup.add(horse);
            });
        }

        function setTimeOfDay(modeKey) {
            const cfg = TIME_MODES[modeKey];
            if (!cfg) return;

            scene.background.setHex(cfg.bg);
            scene.fog.color.setHex(cfg.fog);

            sunLight.color.setHex(cfg.sunColor);
            sunLight.intensity = cfg.sunIntensity;
            sunLight.position.copy(cfg.sunPos);

            hemiLight.color.setHex(cfg.hemiSky);
            hemiLight.groundColor.setHex(cfg.hemiGround);
            hemiLight.intensity = cfg.hemiIntensity;

            skyDome.material.uniforms.topColor.value.copy(cfg.skyTop);
            skyDome.material.uniforms.bottomColor.value.copy(cfg.skyBottom);
            starsGroup.material.opacity = cfg.starsOpacity;

            windowMaterials.forEach(mat => {
                mat.emissiveIntensity = cfg.windowGlow;
            });

            lanternLights.forEach(light => {
                light.intensity = cfg.lampIntensity;
            });

            floodLights.forEach(spot => {
                spot.intensity = modeKey === 'night' ? 45 : (modeKey === 'sunset' ? 12 : 0);
            });
        }

        function setupUI() {
            // Time of Day Buttons
            const timeBtns = {
                morning: document.getElementById('time-morning'),
                sunset: document.getElementById('time-sunset'),
                night: document.getElementById('time-night')
            };

            Object.entries(timeBtns).forEach(([key, btn]) => {
                btn.addEventListener('click', () => {
                    Object.values(timeBtns).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    setTimeOfDay(key);
                });
            });

            // Camera Preset Buttons
            const camButtons = document.querySelectorAll('.cam-btn');
            camButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    camButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const preset = CAMERA_PRESETS[btn.dataset.cam];
                    if (preset) {
                        targetCamPos = preset.pos.clone();
                        targetLookAt = preset.target.clone();
                    }
                });
            });
        }

        function updateKeyboardMovement(delta) {
            const moveSpeed = 38 * delta;
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(forward, camera.up).normalize();

            const move = new THREE.Vector3();
            if (keys.w || keys.ArrowUp) move.add(forward);
            if (keys.s || keys.ArrowDown) move.sub(forward);
            if (keys.d || keys.ArrowRight) move.add(right);
            if (keys.a || keys.ArrowLeft) move.sub(right);

            if (move.lengthSq() > 0) {
                targetCamPos = null;
                targetLookAt = null;
                move.normalize().multiplyScalar(moveSpeed);
                camera.position.add(move);
                controls.target.add(move);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // 1. Procedural Waving Union Jack Flag
            if (flagGeo && flagBasePositions) {
                const posAttr = flagGeo.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const bx = flagBasePositions[i * 3];
                    const by = flagBasePositions[i * 3 + 1];
                    const waveFactor = bx / 7.2; // 0 at pole, 1 at flying tip
                    const waveZ = Math.sin(bx * 1.4 - elapsed * 5.2) * 0.45 * waveFactor
                                + Math.cos(by * 1.8 - elapsed * 3.8) * 0.12 * waveFactor;
                    posAttr.setZ(i, waveZ);
                }
                posAttr.needsUpdate = true;
                flagGeo.computeVertexNormals();
            }

            // 2. Victoria Memorial Water Basin Ripples
            if (waterMesh) {
                waterMesh.position.y = waterBaseY + Math.sin(elapsed * 2.5) * 0.03;
                waterMesh.rotation.y = elapsed * 0.15;
            }

            // 3. Marching Royal Guards Patrols
            marchingGuards.forEach(patrol => {
                const speed = 3.2;
                patrol.mesh.position.x += patrol.dir * speed * delta;
                patrol.mesh.rotation.y = patrol.dir > 0 ? Math.PI / 2 : -Math.PI / 2;

                if (patrol.mesh.position.x >= patrol.maxX) patrol.dir = -1;
                if (patrol.mesh.position.x <= patrol.minX) patrol.dir = 1;

                // Leg & Arm Swing Animation
                const swing = Math.sin(elapsed * 6.5 + patrol.phase) * 0.48;
                const { leftLeg, rightLeg, leftArm, rightArm } = patrol.mesh.userData;
                leftLeg.rotation.x = swing;
                rightLeg.rotation.x = -swing;
                leftArm.rotation.x = -swing * 0.7;
                rightArm.rotation.x = swing * 0.7;
            });

            // 4. Golden Royal Carriage Circling Victoria Memorial Roundabout
            if (carriageGroup) {
                const orbitRadius = 31.5;
                const angle = elapsed * 0.16;
                const cx = Math.sin(angle) * orbitRadius;
                const cz = 44 + Math.cos(angle) * orbitRadius;

                carriageGroup.position.set(cx, 0.18, cz);
                carriageGroup.rotation.y = angle + Math.PI / 2;

                carriageWheels.forEach(w => {
                    w.rotation.z -= delta * 3.2;
                });
            }

            // 5. Smooth Camera Preset Interpolation
            if (targetCamPos && targetLookAt) {
                camera.position.lerp(targetCamPos, 0.05);
                controls.target.lerp(targetLookAt, 0.05);
                if (camera.position.distanceTo(targetCamPos) < 0.25) {
                    targetCamPos = null;
                    targetLookAt = null;
                }
            }

            updateKeyboardMovement(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
