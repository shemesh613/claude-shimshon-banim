<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סין הקסומה - עולם תלת מימדי אינטראקטיבי</title>
    <!-- טעינת גופן עברי אלגנטי -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- טעינת ספריות Three.js ו-OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d131a;
            font-family: 'Rubik', sans-serif;
            color: #f8f5f0;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* מסך טעינה */
        #loader {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e1318 0%, #090b10 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-lantern {
            width: 44px;
            height: 58px;
            background: radial-gradient(circle, #ffdf73 10%, #e63946 65%, #9b111e 100%);
            border-radius: 22px;
            box-shadow: 0 0 35px rgba(230, 57, 70, 0.8), 0 0 60px rgba(255, 190, 11, 0.5);
            animation: floatLantern 2s ease-in-out infinite;
            position: relative;
            margin-bottom: 20px;
        }

        .loader-lantern::before, .loader-lantern::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 5px;
            background: #d4af37;
            border-radius: 3px;
        }
        .loader-lantern::before { top: -3px; }
        .loader-lantern::after { bottom: -3px; }

        @keyframes floatLantern {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.04); }
        }

        .loader-text {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: #ffd166;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        /* ממשק משתמש (HUD) */
        .ui-layer {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            inset: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .title-card {
            pointer-events: auto;
            background: rgba(18, 22, 30, 0.62);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 130, 0.25);
            border-radius: 16px;
            padding: 14px 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .title-card h1 {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 1.65rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffe29a 0%, #ffb703 50%, #fb8500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-card p {
            font-size: 0.85rem;
            color: rgba(248, 245, 240, 0.78);
            font-weight: 300;
        }

        .toggle-hud-btn {
            pointer-events: auto;
            background: rgba(18, 22, 30, 0.68);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 130, 0.3);
            color: #ffd166;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            transition: all 0.25s ease;
        }

        .toggle-hud-btn:hover {
            background: rgba(212, 175, 55, 0.25);
            transform: translateY(-2px);
        }

        .controls-dock {
            pointer-events: auto;
            align-self: center;
            background: rgba(16, 20, 28, 0.68);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 215, 130, 0.22);
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            max-width: 96vw;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .hud-collapsed .controls-dock,
        .hud-collapsed .title-card p {
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px);
        }

        .hud-collapsed .title-card {
            padding: 10px 16px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .group-label {
            font-size: 0.75rem;
            color: rgba(255, 215, 130, 0.75);
            margin-left: 4px;
            font-weight: 500;
        }

        .divider {
            width: 1px;
            height: 26px;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1ede6;
            padding: 7px 13px;
            border-radius: 11px;
            font-family: 'Rubik', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: rgba(255, 215, 130, 0.18);
            border-color: rgba(255, 215, 130, 0.45);
            transform: translateY(-1px);
        }

        .btn.active {
            background: linear-gradient(135deg, rgba(217, 56, 58, 0.85), rgba(168, 32, 34, 0.9));
            border-color: #ffd166;
            color: #fff;
            box-shadow: 0 0 15px rgba(217, 56, 58, 0.45);
        }

        .btn.toggle-on {
            background: rgba(212, 175, 55, 0.25);
            border-color: rgba(255, 209, 102, 0.65);
            color: #ffe29a;
        }

        .hint-badge {
            position: fixed;
            bottom: 88px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.45);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .ui-layer { padding: 12px; }
            .title-card h1 { font-size: 1.25rem; }
            .title-card p { display: none; }
            .divider { display: none; }
            .controls-dock { padding: 10px 12px; gap: 8px; border-radius: 16px; }
            .btn { padding: 6px 10px; font-size: 0.76rem; }
            .hint-badge { bottom: 130px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- מסך טעינה ראשוני -->
    <div id="loader">
        <div class="loader-lantern"></div>
        <div class="loader-text">יוצר את נופי סין הקסומה...</div>
    </div>

    <!-- קנבס התלת-מימד -->
    <div id="canvas-container"></div>

    <!-- שכבת ממשק משתמש -->
    <div class="ui-layer" id="ui-layer">
        <div class="header-bar">
            <div class="title-card">
                <h1>
                    <span>🏮</span>
                    <span>עולם תלת-ממדי: סין הקסומה</span>
                </h1>
                <p>הרי ז'אנגג'יאג'יה, פגודת העננים, החומה הגדולה ונהר הירקן</p>
            </div>
            <button class="toggle-hud-btn" id="btn-toggle-hud" title="הסתר או הצג תפריטים">
                <span id="hud-icon">👁️</span>
                <span id="hud-text">הסתר ממשק</span>
            </button>
        </div>

        <div class="hint-badge" id="controls-hint">
            גרירה לסיבוב • גלגלת לזום • קליק ימני להזזה
        </div>

        <div class="controls-dock">
            <!-- מצלמות -->
            <div class="control-group">
                <span class="group-label">נקודת מבט:</span>
                <button class="btn active" data-cam="overview">🏔️ מבט על</button>
                <button class="btn" data-cam="pagoda">🏯 הפגודה</button>
                <button class="btn" data-cam="wall">🧱 החומה הגדולה</button>
                <button class="btn" data-cam="river">🚣 שייט בנהר</button>
            </div>

            <div class="divider"></div>

            <!-- אווירה ושעה ביום -->
            <div class="control-group">
                <span class="group-label">אווירה:</span>
                <button class="btn active" data-mood="sunset">🌅 שקיעה מוזהבת</button>
                <button class="btn" data-mood="night">🏮 ליל פנסים</button>
                <button class="btn" data-mood="dawn">🌫️ שחר ערפילי</button>
            </div>

            <div class="divider"></div>

            <!-- אפקטים חיים -->
            <div class="control-group">
                <button class="btn toggle-on" id="btn-dragon">🐉 דרקון מעופף</button>
                <button class="btn toggle-on" id="btn-lanterns">✨ פנסים פורחים</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * עולם תלת-ממדי של סין הקסומה - Three.js
         * כולל: הרי קארסט בסגנון ז'אנגג'יאג'יה, מפלי מים, פגודה סינית, החומה הגדולה,
         * גשר אבן קשתי, נהר טורקיז עם סירת סמפאן, עצי דובדבן, דרקון מעופף ופנסי שמיים.
         */

        // משתנים גלובליים לסצנה
        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();

        // אובייקטים מונפשים
        let waterMesh, waterGeo, waterOriginalPositions;
        let sampanBoat, boatLanternLight;
        let dragonGroup, dragonSegments = [];
        let skyLanterns = [];
        let cherryPetals, mistParticles, waterfallParticles;
        let pagodaLanternLights = [];
        let lanternMeshes = [];

        // תאורה ושמיים
        let hemiLight, dirLight, moonLight, ambientGlow;
        let skyDome, sunDisc;

        // מצב מערכת
        let currentMood = 'sunset';
        let showDragon = true;
        let showLanterns = true;

        // אנימציית מעבר מצלמה חלקה
        let camAnim = {
            active: false,
            startPos: new THREE.Vector3(),
            endPos: new THREE.Vector3(),
            startTarget: new THREE.Vector3(),
            endTarget: new THREE.Vector3(),
            progress: 0
        };

        // הגדרות מצבי אווירה (שקיעה, לילה, שחר)
        const MOODS = {
            sunset: {
                skyTop: new THREE.Color(0x1b264f),
                skyHorizon: new THREE.Color(0xff7b54),
                fogColor: new THREE.Color(0xe88d67),
                fogDensity: 0.0036,
                sunColor: new THREE.Color(0xffb703),
                sunIntensity: 1.85,
                sunPos: new THREE.Vector3(-120, 55, -180),
                hemiSky: new THREE.Color(0xffb480),
                hemiGround: new THREE.Color(0x2b3a42),
                hemiIntensity: 0.85,
                waterColor: new THREE.Color(0x16697a),
                lanternGlow: 1.4,
                sunDiscOpacity: 0.9
            },
            night: {
                skyTop: new THREE.Color(0x050814),
                skyHorizon: new THREE.Color(0x132238),
                fogColor: new THREE.Color(0x0c1626),
                fogDensity: 0.0042,
                sunColor: new THREE.Color(0x90caf9),
                sunIntensity: 0.65,
                sunPos: new THREE.Vector3(100, 110, -160),
                hemiSky: new THREE.Color(0x1e3a5f),
                hemiGround: new THREE.Color(0x090d16),
                hemiIntensity: 0.45,
                waterColor: new THREE.Color(0x0a2538),
                lanternGlow: 3.2,
                sunDiscOpacity: 0.25
            },
            dawn: {
                skyTop: new THREE.Color(0x4a6fa5),
                skyHorizon: new THREE.Color(0xdbe9ee),
                fogColor: new THREE.Color(0xc8dce4),
                fogDensity: 0.0052,
                sunColor: new THREE.Color(0xfff1d0),
                sunIntensity: 1.35,
                sunPos: new THREE.Vector3(140, 65, -150),
                hemiSky: new THREE.Color(0xdbe9ee),
                hemiGround: new THREE.Color(0x3d5a58),
                hemiIntensity: 0.95,
                waterColor: new THREE.Color(0x2a9d8f),
                lanternGlow: 0.6,
                sunDiscOpacity: 0.65
            }
        };

        // נקודות מבט למצלמה
        const CAMERA_PRESETS = {
            overview: {
                pos: new THREE.Vector3(0, 68, 138),
                target: new THREE.Vector3(0, 24, -10)
            },
            pagoda: {
                pos: new THREE.Vector3(-12, 62, 38),
                target: new THREE.Vector3(-28, 52, -12)
            },
            wall: {
                pos: new THREE.Vector3(48, 58, -35),
                target: new THREE.Vector3(65, 36, -95)
            },
            river: {
                pos: new THREE.Vector3(24, 9, 58),
                target: new THREE.Vector3(-8, 14, 5)
            }
        };

        // פונקציית עזר לרעש פסאודו-אקראי דטרמיניסטי לעיצוב סלעים
        function pseudoNoise(x, y, z) {
            return Math.sin(x * 0.17 + z * 0.13) * Math.cos(y * 0.19 - x * 0.11) * 0.5 +
                   Math.sin(x * 0.43 - y * 0.37 + z * 0.29) * 0.25;
        }

        // אתחול הסצנה הראשית
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(MOODS.sunset.fogColor, MOODS.sunset.fogDensity);

            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.5, 1000);
            camera.position.copy(CAMERA_PRESETS.overview.pos);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            // בקרי מצלמה אינטראקטיביים
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.copy(CAMERA_PRESETS.overview.target);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI * 0.485; // מניעת ירידה מתחת לפני המים
            controls.minDistance = 12;
            controls.maxDistance = 240;
            controls.update();

            // ביטול אנימציית מצלמה אם המשתמש מזיז ידנית
            controls.addEventListener('start', () => {
                camAnim.active = false;
            });

            // בניית כל מרכיבי העולם
            setupLightingAndSky();
            createRiverAndValley();
            createKarstMountains();
            createWaterfalls();
            createPagoda(-28, 44, -12);
            createGreatWall();
            createStoneBridge(6, 0, 26);
            createSampanBoat();
            createNatureVegetation();
            createCherryBlossomPetals();
            createValleyMist();
            createSkyLanterns();
            createChineseDragon();

            // חיבור אירועי ממשק
            setupUIEvents();
            window.addEventListener('resize', onWindowResize);

            // הסתרת מסך הטעינה והפעלת לולאת האנימציה
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 600);

            setTimeout(() => {
                const hint = document.getElementById('controls-hint');
                if (hint) hint.style.opacity = '0';
            }, 8000);

            animate();
        }

        // 1. הגדרת שמיים ותאורה דינמית
        function setupLightingAndSky() {
            // כיפת שמיים עם גרדיאנט (ShaderMaterial)
            const skyGeo = new THREE.SphereGeometry(420, 32, 24);
            const skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                uniforms: {
                    topColor: { value: MOODS.sunset.skyTop.clone() },
                    horizonColor: { value: MOODS.sunset.skyHorizon.clone() },
                    offset: { value: 20 },
                    exponent: { value: 0.65 }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 horizonColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
                        gl_FragColor = vec4(mix(horizonColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `
            });
            skyDome = new THREE.Mesh(skyGeo, skyMat);
            scene.add(skyDome);

            // דיסקת שמש / ירח זוהרת באופק
            const sunGeo = new THREE.CircleGeometry(22, 32);
            const sunMat = new THREE.MeshBasicMaterial({
                color: 0xffe599,
                transparent: true,
                opacity: 0.9,
                fog: false
            });
            sunDisc = new THREE.Mesh(sunGeo, sunMat);
            sunDisc.position.copy(MOODS.sunset.sunPos);
            sunDisc.lookAt(0, 0, 0);
            scene.add(sunDisc);

            // תאורה המיספרית רכה
            hemiLight = new THREE.HemisphereLight(MOODS.sunset.hemiSky, MOODS.sunset.hemiGround, MOODS.sunset.hemiIntensity);
            scene.add(hemiLight);

            // אור שמש/ירח ראשי עם צללים
            dirLight = new THREE.DirectionalLight(MOODS.sunset.sunColor, MOODS.sunset.sunIntensity);
            dirLight.position.copy(MOODS.sunset.sunPos);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 20;
            dirLight.shadow.camera.far = 450;
            const d = 120;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);
        }

        // 2. נהר הירקן וקרקעית העמק
        function createRiverAndValley() {
            // קרקעית עמוקה מתחת למים
            const bedGeo = new THREE.PlaneGeometry(700, 700);
            const bedMat = new THREE.MeshStandardMaterial({
                color: 0x132a2e,
                roughness: 0.9
            });
            const bed = new THREE.Mesh(bedGeo, bedMat);
            bed.rotation.x = -Math.PI / 2;
            bed.position.y = -2.2;
            scene.add(bed);

            // משטח המים עם גלים עדינים
            waterGeo = new THREE.PlaneGeometry(600, 600, 90, 90);
            waterGeo.rotateX(-Math.PI / 2);
            waterOriginalPositions = Float32Array.from(waterGeo.attributes.position.array);

            const waterMat = new THREE.MeshStandardMaterial({
                color: MOODS.sunset.waterColor,
                roughness: 0.14,
                metalness: 0.65,
                transparent: true,
                opacity: 0.88,
                flatShading: false
            });

            waterMesh = new THREE.Mesh(waterGeo, waterMat);
            waterMesh.receiveShadow = true;
            scene.add(waterMesh);

            // גדות ירוקות משני צידי הנהר ואיים קטנים
            const bankPositions = [
                { x: -38, z: 22, rx: 28, rz: 22, h: 3.2 },
                { x: 42, z: 28, rx: 32, rz: 25, h: 3.5 },
                { x: -55, z: -30, rx: 36, rz: 30, h: 4.5 },
                { x: 55, z: -25, rx: 38, rz: 32, h: 4.8 },
                { x: 0, z: -65, rx: 55, rz: 35, h: 6.0 }
            ];

            bankPositions.forEach(b => {
                const geo = new THREE.CylinderGeometry(b.rx * 0.75, b.rx, b.h, 24, 4);
                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const vx = pos.getX(i);
                    const vy = pos.getY(i);
                    const vz = pos.getZ(i);
                    const n = pseudoNoise(vx * 0.3, vy, vz * 0.3);
                    pos.setX(i, vx + n * 3.5);
                    pos.setZ(i, vz + n * 3.5);
                }
                geo.computeVertexNormals();
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x2d5a3c,
                    roughness: 0.88
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(b.x, b.h * 0.35 - 0.5, b.z);
                mesh.scale.set(1, 1, b.rz / b.rx);
                mesh.receiveShadow = true;
                mesh.castShadow = true;
                scene.add(mesh);
            });
        }

        // 3. הרי הקארסט האנכיים של ז'אנגג'יאג'יה (סגנון אווטאר)
        function createKarstMountains() {
            const pillarsData = [
                // ההר הראשי שעליו ניצבת הפגודה
                { x: -28, z: -12, radius: 13.5, height: 44, hasWaterfall: true },
                // צוקים סמוכים דרמטיים
                { x: -52, z: -8, radius: 9.5, height: 54, hasWaterfall: false },
                { x: -16, z: -36, radius: 10.5, height: 62, hasWaterfall: true },
                { x: 18, z: -28, radius: 11.0, height: 48, hasWaterfall: true },
                { x: 38, z: -14, radius: 8.8, height: 39, hasWaterfall: false },
                { x: -64, z: -35, radius: 12.0, height: 68, hasWaterfall: false },
                { x: 8, z: -55, radius: 13.0, height: 72, hasWaterfall: true },
                { x: -38, z: -58, radius: 11.5, height: 65, hasWaterfall: false },
                // צוקים רחוקים לעומק הסצנה
                { x: -85, z: -75, radius: 16.0, height: 82, hasWaterfall: false },
                { x: -20, z: -90, radius: 18.0, height: 88, hasWaterfall: false },
                { x: 45, z: -85, radius: 17.0, height: 76, hasWaterfall: false },
                { x: 92, z: -65, radius: 15.0, height: 68, hasWaterfall: false },
                // עמודי סלע קטנים יותר בקדמת הנוף
                { x: -46, z: 18, radius: 5.2, height: 18, hasWaterfall: false },
                { x: 46, z: 15, radius: 5.8, height: 22, hasWaterfall: false }
            ];

            pillarsData.forEach(p => {
                createSingleKarstPillar(p.x, p.z, p.radius, p.height);
            });

            // רכס הרים מזרחי שעליו עוברת החומה הגדולה
            createEasternRidge();
        }

        function createSingleKarstPillar(x, z, radius, height) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const radialSegs = 22;
            const heightSegs = 28;
            const geo = new THREE.CylinderGeometry(radius * 0.82, radius * 1.18, height, radialSegs, heightSegs);
            geo.translate(0, height / 2 - 1, 0);

            const pos = geo.attributes.position;
            const colors = [];

            const rockBaseColor = new THREE.Color(0x4a4542);
            const rockHighlight = new THREE.Color(0x7c6f64);
            const mossColor = new THREE.Color(0x2d5a36);

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);

                const heightRatio = Math.max(0, Math.min(1, vy / height));
                const angle = Math.atan2(vz, vx);

                // יצירת חריצים אנכיים ושכבות סלע אופקיות אופייניות לז'אנגג'יאג'יה
                const verticalFluting = Math.sin(angle * 7 + x) * 0.14 + Math.cos(angle * 13 + z) * 0.08;
                const horizontalStrata = Math.sin(vy * 0.55) * 0.06;
                const noiseVal = pseudoNoise(vx * 0.4 + x, vy * 0.25, vz * 0.4 + z);

                const scaleFactor = 1 + verticalFluting + horizontalStrata + noiseVal * 0.18;
                pos.setX(i, vx * scaleFactor);
                pos.setZ(i, vz * scaleFactor);

                // צביעת קודקודים: סלע אפור-חום עם טחב ירוק בחלק העליון ובחריצים
                const c = rockBaseColor.clone().lerp(rockHighlight, Math.max(0, horizontalStrata * 6 + 0.5));
                if (heightRatio > 0.78 || (noiseVal > 0.22 && heightRatio > 0.35)) {
                    c.lerp(mossColor, heightRatio > 0.88 ? 0.85 : 0.45);
                }
                colors.push(c.r, c.g, c.b);
            }

            geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geo.computeVertexNormals();

            const mat = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.9,
                metalness: 0.05
            });

            const pillarMesh = new THREE.Mesh(geo, mat);
            pillarMesh.castShadow = true;
            pillarMesh.receiveShadow = true;
            group.add(pillarMesh);

            // כיפת צמחייה ירוקה ועצים ננסיים בראש הצוק
            const capCount = Math.floor(radius * 1.4);
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x245232, roughness: 0.85 });
            const pineMat = new THREE.MeshStandardMaterial({ color: 0x1b4328, roughness: 0.8 });

            for (let i = 0; i < capCount; i++) {
                const a = (i / capCount) * Math.PI * 2 + x;
                const dist = (Math.sin(i * 3.1) * 0.45 + 0.45) * (radius * 0.65);
                const bx = Math.cos(a) * dist;
                const bz = Math.sin(a) * dist;
                const bushSize = 1.6 + (i % 3) * 0.8;

                const bush = new THREE.Mesh(new THREE.DodecahedronGeometry(bushSize, 1), foliageMat);
                bush.position.set(bx, height - 0.8, bz);
                bush.scale.set(1.2, 0.75, 1.2);
                bush.castShadow = true;
                group.add(bush);

                // הוספת עצי אורן סיניים קטנים על חלק מהצוקים
                if (i % 3 === 0 && dist > radius * 0.25) {
                    const tree = createStylizedPine(1.2 + (i % 2) * 0.5, pineMat);
                    tree.position.set(bx, height - 0.3, bz);
                    group.add(tree);
                }
            }

            scene.add(group);
        }

        function createStylizedPine(scale, foliageMat) {
            const treeGroup = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.28, 2.5, 6), trunkMat);
            trunk.position.y = 1.25;
            treeGroup.add(trunk);

            for (let i = 0; i < 3; i++) {
                const pad = new THREE.Mesh(new THREE.CylinderGeometry(0.9 - i * 0.2, 1.5 - i * 0.25, 0.45, 7), foliageMat);
                pad.position.set((i % 2 === 0 ? 0.2 : -0.2), 2.1 + i * 0.75, 0);
                treeGroup.add(pad);
            }
            treeGroup.scale.setScalar(scale);
            return treeGroup;
        }

        // רכס ההרים שעליו בנויה החומה הגדולה
        function createEasternRidge() {
            const ridgeGeo = new THREE.PlaneGeometry(160, 180, 40, 40);
            ridgeGeo.rotateX(-Math.PI / 2);
            const pos = ridgeGeo.attributes.position;
            const colors = [];

            const grassColor = new THREE.Color(0x2b5434);
            const rockColor = new THREE.Color(0x524c47);

            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vz = pos.getZ(i);

                // גובה הרכס יוצר שלוחה מתפתלת
                const spineX = Math.sin(vz * 0.035) * 18;
                const distFromSpine = Math.abs(vx - spineX);
                let h = Math.max(0, 42 - distFromSpine * 0.72 + Math.sin(vz * 0.06) * 8);
                h += pseudoNoise(vx * 0.15, 0, vz * 0.15) * 3.5;

                // שקיעה הדרגתית בקצוות
                const edgeFade = Math.max(0, 1 - Math.pow(vz / 90, 4));
                h *= edgeFade;

                pos.setY(i, h - 1);

                const c = grassColor.clone().lerp(rockColor, h > 32 ? 0.45 : 0.15);
                colors.push(c.r, c.g, c.b);
            }

            ridgeGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            ridgeGeo.computeVertexNormals();

            const ridgeMat = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.92
            });

            const ridgeMesh = new THREE.Mesh(ridgeGeo, ridgeMat);
            ridgeMesh.position.set(78, 0, -95);
            ridgeMesh.receiveShadow = true;
            ridgeMesh.castShadow = true;
            scene.add(ridgeMesh);
        }

        // 4. מפלי מים זורמים מהצוקים אל הנהר
        function createWaterfalls() {
            const falls = [
                { x: -18, y: 40, z: -6, h: 40, w: 2.2 },
                { x: -11, y: 56, z: -28, h: 56, w: 2.6 },
                { x: 14, y: 44, z: -19, h: 44, w: 2.0 },
                { x: 4, y: 66, z: -44, h: 66, w: 3.0 }
            ];

            falls.forEach(f => {
                // סרט מים לבן-טורקיז חצי שקוף
                const geo = new THREE.PlaneGeometry(f.w, f.h, 4, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xd8f3dc,
                    emissive: 0x48cae4,
                    emissiveIntensity: 0.25,
                    transparent: true,
                    opacity: 0.72,
                    roughness: 0.2,
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(f.x, f.h / 2, f.z);
                mesh.lookAt(f.x, f.h / 2, f.z + 20);
                scene.add(mesh);
            });

            // חלקיקי רסס מים וקצף בבסיס המפלים
            const count = 450;
            const pGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                const fall = falls[i % falls.length];
                positions[i * 3] = fall.x + (Math.random() - 0.5) * (fall.w + 1.5);
                positions[i * 3 + 1] = Math.random() * fall.h;
                positions[i * 3 + 2] = fall.z + (Math.random() - 0.5) * 2.5;
                velocities[i] = 14 + Math.random() * 10;
            }

            pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            pGeo.userData = { velocities, falls };

            const pMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.9,
                transparent: true,
                opacity: 0.65
            });

            waterfallParticles = new THREE.Points(pGeo, pMat);
            scene.add(waterfallParticles);
        }

        // 5. פגודה סינית מסורתית רבת-קומות בראש ההר
        function createPagoda(x, y, z) {
            const pagoda = new THREE.Group();
            pagoda.position.set(x, y, z);

            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8d8680, roughness: 0.85 });
            const redWoodMat = new THREE.MeshStandardMaterial({ color: 0x9e1b1e, roughness: 0.5 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xe6b83a, metalness: 0.75, roughness: 0.25 });
            const roofTileMat = new THREE.MeshStandardMaterial({ color: 0x1f2833, roughness: 0.45, metalness: 0.2 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf4ebd9, roughness: 0.7 });

            // מרפסת אבן ומדרגות בבסיס הפגודה
            const base = new THREE.Mesh(new THREE.CylinderGeometry(8.2, 9.2, 1.6, 8), stoneMat);
            base.position.y = 0.8;
            base.castShadow = true;
            base.receiveShadow = true;
            pagoda.add(base);

            const balustrade = new THREE.Mesh(new THREE.CylinderGeometry(7.9, 7.9, 0.7, 8, 1, true), redWoodMat);
            balustrade.position.y = 1.9;
            pagoda.add(balustrade);

            // בניית 5 קומות הולכות וקטנות
            const tiers = 5;
            let currentY = 1.6;

            for (let t = 0; t < tiers; t++) {
                const scale = 1 - t * 0.14;
                const tierHeight = 3.2 * (1 - t * 0.06);
                const radius = 5.2 * scale;

                // גוף הקומה (קירות בהירים ועמודים אדומים)
                const core = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.78, radius * 0.78, tierHeight, 8), wallMat);
                core.position.y = currentY + tierHeight / 2;
                core.castShadow = true;
                pagoda.add(core);

                // 8 עמודי עץ אדומים היקפיים
                for (let c = 0; c < 8; c++) {
                    const angle = (c / 8) * Math.PI * 2;
                    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * scale, 0.22 * scale, tierHeight, 8), redWoodMat);
                    pillar.position.set(
                        Math.cos(angle) * radius * 0.86,
                        currentY + tierHeight / 2,
                        Math.sin(angle) * radius * 0.86
                    );
                    pagoda.add(pillar);
                }

                // גג רעפים מתעקל כלפי מעלה (Eaves)
                const roofY = currentY + tierHeight;
                const roof = createCurvedPagodaRoof(radius * 1.48, 1.55 * scale, roofTileMat, goldMat);
                roof.position.y = roofY;
                pagoda.add(roof);

                // פנסים סיניים תלויים מפינות הגג
                if (t === 0 || t === 2 || t === 4) {
                    for (let l = 0; l < 4; l++) {
                        const lAngle = (l / 4) * Math.PI * 2 + Math.PI / 8;
                        const lx = Math.cos(lAngle) * radius * 1.38;
                        const lz = Math.sin(lAngle) * radius * 1.38;
                        const lantern = createHangingLantern(0.35 * scale);
                        lantern.position.set(lx, roofY - 0.15, lz);
                        pagoda.add(lantern);
                    }
                }

                currentY += tierHeight + 0.75 * scale;
            }

            // צריח זהב מעוטר בראש הפגודה
            const spire = new THREE.Mesh(new THREE.ConeGeometry(0.45, 3.6, 12), goldMat);
            spire.position.y = currentY + 1.8;
            pagoda.add(spire);

            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12), goldMat);
            orb.position.y = currentY + 0.6;
            pagoda.add(orb);

            // אור חם הבוקע מתוך הפגודה
            const pagodaLight = new THREE.PointLight(0xff9e00, 2.2, 45);
            pagodaLight.position.set(0, 8, 0);
            pagoda.add(pagodaLight);
            pagodaLanternLights.push(pagodaLight);

            scene.add(pagoda);
        }

        function createCurvedPagodaRoof(radius, height, roofMat, trimMat) {
            const group = new THREE.Group();
            const geo = new THREE.ConeGeometry(radius, height, 8, 5);
            const pos = geo.attributes.position;

            // עיקול קצוות הגג כלפי מעלה בסגנון אדריכלות סינית
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);
                const r = Math.sqrt(vx * vx + vz * vz) / radius;
                const curveUp = Math.pow(r, 2.4) * height * 0.55;
                pos.setY(i, vy + curveUp);
            }
            geo.computeVertexNormals();

            const mesh = new THREE.Mesh(geo, roofMat);
            mesh.castShadow = true;
            group.add(mesh);

            // עיטורי זהב בקצות הרעפים
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.55, 6), trimMat);
                tip.position.set(Math.cos(a) * radius * 0.98, -height * 0.02, Math.sin(a) * radius * 0.98);
                tip.rotation.z = -Math.cos(a) * 0.6;
                tip.rotation.x = Math.sin(a) * 0.6;
                group.add(tip);
            }

            return group;
        }

        function createHangingLantern(scale = 0.4) {
            const group = new THREE.Group();
            const lanternMat = new THREE.MeshStandardMaterial({
                color: 0xe63946,
                emissive: 0xff5400,
                emissiveIntensity: 1.4,
                roughness: 0.3
            });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd166, metalness: 0.8, roughness: 0.2 });

            const body = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 12), lanternMat);
            body.scale.set(0.85, 1.15, 0.85);
            group.add(body);
            lanternMeshes.push(body);

            const capTop = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 10), goldMat);
            capTop.position.y = 1.1;
            group.add(capTop);

            const capBot = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.2, 10), goldMat);
            capBot.position.y = -1.1;
            group.add(capBot);

            const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.16, 1.1, 6), lanternMat);
            tassel.position.y = -1.7;
            group.add(tassel);

            group.scale.setScalar(scale);
            return group;
        }

        // 6. החומה הגדולה של סין מתפתלת לאורך רכס ההרים
        function createGreatWall() {
            const wallGroup = new THREE.Group();
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x9e9589, roughness: 0.88 });
            const trimMat = new THREE.MeshStandardMaterial({ color: 0x6e665f, roughness: 0.9 });

            // חישוב מסלול החומה לאורך קו הרכס המזרחי
            const points = [];
            for (let z = -165; z <= -25; z += 7) {
                const localZ = z + 95;
                const spineX = 78 + Math.sin(localZ * 0.035) * 18;
                const edgeFade = Math.max(0, 1 - Math.pow(localZ / 90, 4));
                const y = Math.max(2, (42 + Math.sin(localZ * 0.06) * 8) * edgeFade);
                points.push(new THREE.Vector3(spineX, y, z));
            }

            // בניית מקטעי החומה בין הנקודות
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i];
                const p2 = points[i + 1];
                const mid = p1.clone().add(p2).multiplyScalar(0.5);
                const len = p1.distanceTo(p2);

                const segGroup = new THREE.Group();
                segGroup.position.copy(mid);
                segGroup.lookAt(p2);

                // גוף החומה המרכזי
                const wallBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 3.2, len + 0.4), wallMat);
                wallBody.position.y = 0.5;
                wallBody.castShadow = true;
                segGroup.add(wallBody);

                // שיני חומה (Battlements) משני הצדדים
                const battlementL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, len + 0.2), trimMat);
                battlementL.position.set(-0.95, 2.3, 0);
                segGroup.add(battlementL);

                const battlementR = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.8, len + 0.2), trimMat);
                battlementR.position.set(0.95, 2.3, 0);
                segGroup.add(battlementR);

                wallGroup.add(segGroup);

                // מגדל שמירה (Watchtower) כל 4 מקטעים
                if (i % 4 === 1) {
                    const tower = new THREE.Group();
                    tower.position.copy(p1);
                    tower.position.y += 1.2;

                    const towerBase = new THREE.Mesh(new THREE.BoxGeometry(4.2, 4.8, 4.2), wallMat);
                    towerBase.castShadow = true;
                    tower.add(towerBase);

                    const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 1.6, 4), trimMat);
                    towerRoof.position.y = 3.1;
                    towerRoof.rotation.y = Math.PI / 4;
                    tower.add(towerRoof);

                    // פנס אזהרה זוהר במגדל השמירה
                    const beacon = new THREE.Mesh(
                        new THREE.SphereGeometry(0.4, 8, 8),
                        new THREE.MeshStandardMaterial({ color: 0xff9e00, emissive: 0xff6d00, emissiveIntensity: 2 })
                    );
                    beacon.position.y = 2.2;
                    tower.add(beacon);
                    lanternMeshes.push(beacon);

                    wallGroup.add(tower);
                }
            }

            scene.add(wallGroup);
        }

        // 7. גשר אבן סיני קשתי מעל הנהר
        function createStoneBridge(x, y, z) {
            const bridge = new THREE.Group();
            bridge.position.set(x, y, z);

            const stoneMat = new THREE.MeshStandardMaterial({ color: 0xb5aca0, roughness: 0.85 });
            const archRadius = 9.5;
            const width = 4.2;
            const segments = 22;

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const angle = Math.PI * (0.12 + t * 0.76);
                const bx = Math.cos(angle) * archRadius * 1.45;
                const by = Math.sin(angle) * archRadius * 0.68 - 1.2;

                const block = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.1, width), stoneMat);
                block.position.set(bx, by, 0);
                block.rotation.z = angle - Math.PI / 2;
                block.castShadow = true;
                block.receiveShadow = true;
                bridge.add(block);

                // מעקות אבן משני צידי הגשר
                const railL = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.9, 0.35), stoneMat);
                railL.position.set(bx, by + 0.9, width / 2 - 0.2);
                railL.rotation.z = angle - Math.PI / 2;
                bridge.add(railL);

                const railR = railL.clone();
                railR.position.z = -width / 2 + 0.2;
                bridge.add(railR);
            }

            // 4 עמודי פנסים בקצוות הגשר
            const postCoords = [
                [-12.2, 2.2, width / 2 - 0.2],
                [-12.2, 2.2, -width / 2 + 0.2],
                [12.2, 2.2, width / 2 - 0.2],
                [12.2, 2.2, -width / 2 + 0.2]
            ];

            postCoords.forEach(c => {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 2.4, 8), stoneMat);
                post.position.set(c[0], c[1], c[2]);
                bridge.add(post);

                const lantern = createHangingLantern(0.32);
                lantern.position.set(c[0], c[1] + 1.4, c[2]);
                bridge.add(lantern);
            });

            scene.add(bridge);
        }

        // 8. סירת סמפאן מסורתית עם חופה ופנס בחרטום
        function createSampanBoat() {
            sampanBoat = new THREE.Group();

            const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x4a2c18, roughness: 0.75 });
            const bambooMat = new THREE.MeshStandardMaterial({ color: 0xc29b61, roughness: 0.8 });

            // גוף הסירה המעוקל
            const hullGeo = new THREE.CylinderGeometry(0.9, 0.45, 7.2, 12, 1);
            hullGeo.rotateZ(Math.PI / 2);
            hullGeo.scale(1, 0.55, 1.35);
            const hull = new THREE.Mesh(hullGeo, darkWoodMat);
            hull.position.y = 0.25;
            hull.castShadow = true;
            sampanBoat.add(hull);

            // חופת במבוק קשתית במרכז הסירה
            const canopyGeo = new THREE.CylinderGeometry(1.15, 1.15, 2.8, 12, 1, true, 0, Math.PI);
            canopyGeo.rotateZ(Math.PI / 2);
            canopyGeo.rotateX(Math.PI / 2);
            const canopy = new THREE.Mesh(canopyGeo, bambooMat);
            canopy.position.set(-0.2, 0.45, 0);
            canopy.material.side = THREE.DoubleSide;
            sampanBoat.add(canopy);

            // דמות שייט סיני עם כובע קש חרוטי
            const robeMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a, roughness: 0.8 });
            const hatMat = new THREE.MeshStandardMaterial({ color: 0xe9c46a, roughness: 0.7 });
            const fisherBody = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.35, 1.2, 8), robeMat);
            fisherBody.position.set(-2.2, 0.95, 0);
            sampanBoat.add(fisherBody);

            const conicalHat = new THREE.Mesh(new THREE.ConeGeometry(0.65, 0.35, 12), hatMat);
            conicalHat.position.set(-2.2, 1.65, 0);
            sampanBoat.add(conicalHat);

            // עמוד בחרטום הסירה עם פנס אדום מאיר את המים
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 2.2, 6), darkWoodMat);
            pole.position.set(2.9, 1.2, 0);
            pole.rotation.z = -0.25;
            sampanBoat.add(pole);

            const bowLantern = createHangingLantern(0.32);
            bowLantern.position.set(3.25, 1.9, 0);
            sampanBoat.add(bowLantern);

            boatLanternLight = new THREE.PointLight(0xff7b00, 2.0, 22);
            boatLanternLight.position.set(3.3, 1.8, 0);
            sampanBoat.add(boatLanternLight);
            pagodaLanternLights.push(boatLanternLight);

            sampanBoat.position.set(0, 0.05, 42);
            scene.add(sampanBoat);
        }

        // 9. עצי דובדבן פורחים (Sakura) וחורשות במבוק
        function createNatureVegetation() {
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2822, roughness: 0.9 });
            const blossomMat1 = new THREE.MeshStandardMaterial({
                color: 0xffb7c5,
                emissive: 0xff6b8b,
                emissiveIntensity: 0.18,
                roughness: 0.65
            });
            const blossomMat2 = new THREE.MeshStandardMaterial({
                color: 0xffd6e0,
                emissive: 0xff8fa3,
                emissiveIntensity: 0.15,
                roughness: 0.65
            });

            // מיקומי עצי דובדבן ליד הפגודה ועל גדות הנהר
            const sakuraLocations = [
                { x: -20, y: 44, z: -16, s: 1.1 },
                { x: -35, y: 44, z: -8, s: 1.0 },
                { x: -25, y: 44, z: -4, s: 0.9 },
                { x: -22, y: 2.2, z: 24, s: 1.4 },
                { x: -34, y: 2.4, z: 18, s: 1.2 },
                { x: 24, y: 2.2, z: 25, s: 1.45 },
                { x: 35, y: 2.5, z: 20, s: 1.25 },
                { x: -16, y: 1.8, z: 32, s: 1.1 }
            ];

            sakuraLocations.forEach((loc, idx) => {
                const tree = new THREE.Group();
                tree.position.set(loc.x, loc.y, loc.z);

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.48, 3.8, 7), trunkMat);
                trunk.position.y = 1.9;
                trunk.rotation.z = (idx % 2 === 0 ? 0.12 : -0.12);
                trunk.castShadow = true;
                tree.add(trunk);

                // ענפי פריחה ורודים עשירים
                const puffOffsets = [
                    [0, 4.2, 0, 2.2],
                    [-1.4, 3.7, 0.8, 1.6],
                    [1.5, 3.8, -0.6, 1.7],
                    [0.3, 4.6, 1.2, 1.5],
                    [-0.6, 4.4, -1.2, 1.5]
                ];

                puffOffsets.forEach((p, pIdx) => {
                    const puff = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(p[3], 1),
                        pIdx % 2 === 0 ? blossomMat1 : blossomMat2
                    );
                    puff.position.set(p[0], p[1], p[2]);
                    puff.scale.set(1.25, 0.82, 1.25);
                    puff.castShadow = true;
                    tree.add(puff);
                });

                tree.scale.setScalar(loc.s);
                scene.add(tree);
            });

            // חורשות במבוק ירוקות לאורך הגדות
            const bambooMat = new THREE.MeshStandardMaterial({ color: 0x4c9540, roughness: 0.55 });
            const bambooGroves = [
                { x: -42, y: 2.0, z: 28, count: 16 },
                { x: 44, y: 2.0, z: 32, count: 18 },
                { x: -48, y: 3.2, z: -22, count: 14 },
                { x: 48, y: 3.2, z: -18, count: 14 }
            ];

            bambooGroves.forEach(grove => {
                const group = new THREE.Group();
                group.position.set(grove.x, grove.y, grove.z);
                for (let i = 0; i < grove.count; i++) {
                    const h = 6 + (i % 5) * 1.6;
                    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, h, 6), bambooMat);
                    stalk.position.set(
                        Math.sin(i * 2.3) * 4.5,
                        h / 2,
                        Math.cos(i * 1.9) * 4.5
                    );
                    stalk.rotation.z = Math.sin(i) * 0.08;
                    stalk.rotation.x = Math.cos(i) * 0.08;
                    group.add(stalk);
                }
                scene.add(group);
            });
        }

        // 10. עלי כותרת ורודים נישאים ברוח
        function createCherryBlossomPetals() {
            const count = 420;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const phases = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 110;
                positions[i * 3 + 1] = Math.random() * 55;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 90;
                phases[i] = Math.random() * Math.PI * 2;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.userData = { phases };

            const mat = new THREE.PointsMaterial({
                color: 0xffb7c5,
                size: 0.65,
                transparent: true,
                opacity: 0.85
            });

            cherryPetals = new THREE.Points(geo, mat);
            scene.add(cherryPetals);
        }

        // 11. שכבות ערפל רכות המרחפות בעמקים בין הצוקים
        function createValleyMist() {
            // יצירת טקסטורת ערפל רכה בפרוצדורה (Canvas) ללא צורך בקובץ חיצוני
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.14)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);

            const mistTex = new THREE.CanvasTexture(canvas);
            const count = 85;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 180;
                positions[i * 3 + 1] = 8 + Math.random() * 28;
                positions[i * 3 + 2] = -10 + (Math.random() - 0.5) * 140;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const mat = new THREE.PointsMaterial({
                map: mistTex,
                size: 46,
                transparent: true,
                opacity: 0.42,
                depthWrite: false
            });

            mistParticles = new THREE.Points(geo, mat);
            scene.add(mistParticles);
        }

        // 12. פנסי שמיים סיניים (Kongming Lanterns) המרחפים מעלה
        function createSkyLanterns() {
            const lanternGeo = new THREE.CylinderGeometry(0.55, 0.38, 1.25, 10);
            const lanternMat = new THREE.MeshStandardMaterial({
                color: 0xff9f1c,
                emissive: 0xff5400,
                emissiveIntensity: 2.2,
                roughness: 0.3
            });

            for (let i = 0; i < 42; i++) {
                const mesh = new THREE.Mesh(lanternGeo, lanternMat);
                mesh.position.set(
                    (Math.random() - 0.5) * 150,
                    6 + Math.random() * 85,
                    (Math.random() - 0.5) * 130
                );
                const scale = 0.7 + Math.random() * 0.65;
                mesh.scale.setScalar(scale);

                scene.add(mesh);
                skyLanterns.push({
                    mesh,
                    speedY: 1.4 + Math.random() * 1.4,
                    swaySpeed: 0.6 + Math.random() * 0.8,
                    swayOffset: Math.random() * Math.PI * 2,
                    baseX: mesh.position.x,
                    baseZ: mesh.position.z
                });
            }
        }

        // 13. דרקון סיני אגדי זוהר המתפתל בין פסגות ההרים
        function createChineseDragon() {
            dragonGroup = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xd90429,
                emissive: 0xff6d00,
                emissiveIntensity: 1.1,
                roughness: 0.3,
                metalness: 0.4
            });

            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xffd166,
                emissive: 0xffb703,
                emissiveIntensity: 1.4,
                roughness: 0.25,
                metalness: 0.8
            });

            const numSegments = 34;
            for (let i = 0; i < numSegments; i++) {
                const t = i / numSegments;
                const segGroup = new THREE.Group();

                if (i === 0) {
                    // ראש הדרקון המלכותי עם קרניים ורעמה זהובה
                    const head = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.8, 10), goldMat);
                    head.rotation.x = Math.PI / 2;
                    segGroup.add(head);

                    const snout = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 2.2), bodyMat);
                    snout.position.z = 0.8;
                    segGroup.add(snout);

                    // קרניים זהובות
                    const hornL = new THREE.Mesh(new THREE.ConeGeometry(0.22, 2.6, 6), goldMat);
                    hornL.position.set(-0.7, 1.3, -0.8);
                    hornL.rotation.x = -0.5;
                    hornL.rotation.z = 0.25;
                    segGroup.add(hornL);

                    const hornR = hornL.clone();
                    hornR.position.x = 0.7;
                    hornR.rotation.z = -0.25;
                    segGroup.add(hornR);

                    // אור פנימי לדרקון
                    const dragonLight = new THREE.PointLight(0xff9e00, 2.2, 40);
                    segGroup.add(dragonLight);
                } else {
                    // חוליות גוף הדרקון הולכות וצרות לכיוון הזנב
                    const radius = Math.max(0.25, (1 - t * 0.82) * 1.25);
                    const sphere = new THREE.Mesh(
                        new THREE.SphereGeometry(radius, 10, 10),
                        i % 2 === 0 ? bodyMat : goldMat
                    );
                    sphere.scale.set(1, 1, 1.45);
                    segGroup.add(sphere);

                    // קוצי גב זהובים
                    if (i % 2 === 0 && i < numSegments - 3) {
                        const fin = new THREE.Mesh(new THREE.ConeGeometry(0.25, radius * 1.5, 5), goldMat);
                        fin.position.y = radius * 1.1;
                        segGroup.add(fin);
                    }
                }

                dragonGroup.add(segGroup);
                dragonSegments.push(segGroup);
            }

            scene.add(dragonGroup);
        }

        // החלפת מצבי אווירה (שקיעה / לילה / שחר)
        function applyMood(moodKey) {
            currentMood = moodKey;
            const m = MOODS[moodKey];

            skyDome.material.uniforms.topColor.value.copy(m.skyTop);
            skyDome.material.uniforms.horizonColor.value.copy(m.skyHorizon);

            scene.fog.color.copy(m.fogColor);
            scene.fog.density = m.fogDensity;

            dirLight.color.copy(m.sunColor);
            dirLight.intensity = m.sunIntensity;
            dirLight.position.copy(m.sunPos);

            sunDisc.position.copy(m.sunPos);
            sunDisc.lookAt(0, 0, 0);
            sunDisc.material.opacity = m.sunDiscOpacity;

            hemiLight.color.copy(m.hemiSky);
            hemiLight.groundColor.copy(m.hemiGround);
            hemiLight.intensity = m.hemiIntensity;

            waterMesh.material.color.copy(m.waterColor);

            // התאמת עוצמת זוהר הפנסים בהתאם לשעה ביום
            pagodaLanternLights.forEach(light => {
                light.intensity = m.lanternGlow * 1.5;
            });

            lanternMeshes.forEach(mesh => {
                if (mesh.material && mesh.material.emissiveIntensity !== undefined) {
                    mesh.material.emissiveIntensity = m.lanternGlow;
                }
            });
        }

        // מעבר מצלמה חלק לנקודת עניין
        function flyToPreset(presetKey) {
            const preset = CAMERA_PRESETS[presetKey];
            if (!preset) return;

            camAnim.startPos.copy(camera.position);
            camAnim.endPos.copy(preset.pos);
            camAnim.startTarget.copy(controls.target);
            camAnim.endTarget.copy(preset.target);
            camAnim.progress = 0;
            camAnim.active = true;
        }

        // הגדרת מאזינים לכפתורי הממשק
        function setupUIEvents() {
            // כפתורי מצלמה
            document.querySelectorAll('[data-cam]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    flyToPreset(btn.dataset.cam);
                });
            });

            // כפתורי אווירה
            document.querySelectorAll('[data-mood]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-mood]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    applyMood(btn.dataset.mood);
                });
            });

            // הפעלה/כיבוי דרקון מעופף
            const btnDragon = document.getElementById('btn-dragon');
            btnDragon.addEventListener('click', () => {
                showDragon = !showDragon;
                dragonGroup.visible = showDragon;
                btnDragon.classList.toggle('toggle-on', showDragon);
            });

            // הפעלה/כיבוי פנסי שמיים
            const btnLanterns = document.getElementById('btn-lanterns');
            btnLanterns.addEventListener('click', () => {
                showLanterns = !showLanterns;
                skyLanterns.forEach(l => l.mesh.visible = showLanterns);
                btnLanterns.classList.toggle('toggle-on', showLanterns);
            });

            // הסתרת/הצגת שכבת HUD
            const btnHud = document.getElementById('btn-toggle-hud');
            const uiLayer = document.getElementById('ui-layer');
            const hudText = document.getElementById('hud-text');
            const hudIcon = document.getElementById('hud-icon');

            btnHud.addEventListener('click', () => {
                const collapsed = uiLayer.classList.toggle('hud-collapsed');
                hudText.textContent = collapsed ? 'הצג ממשק' : 'הסתר ממשק';
                hudIcon.textContent = collapsed ? '✨' : '👁️';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // לולאת האנימציה הראשית (60fps)
        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // 1. אנימציית מעבר מצלמה חלק
            if (camAnim.active) {
                camAnim.progress += dt * 0.85;
                const t = Math.min(1, camAnim.progress);
                // Smoothstep easing
                const ease = t * t * (3 - 2 * t);

                camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
                controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);

                if (t >= 1) camAnim.active = false;
            }
            controls.update();

            // 2. גלי מים עדינים בנהר
            if (waterGeo) {
                const pos = waterGeo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const ox = waterOriginalPositions[i * 3];
                    const oz = waterOriginalPositions[i * 3 + 2];
                    const wave = Math.sin(ox * 0.14 + elapsed * 1.4) * 0.12 +
                                 Math.cos(oz * 0.16 + elapsed * 1.1) * 0.10;
                    pos.setY(i, wave);
                }
                pos.needsUpdate = true;
            }

            // 3. שייט סירת הסמפאן לאורך הנהר
            if (sampanBoat) {
                const boatAngle = elapsed * 0.14;
                const bx = Math.sin(boatAngle) * 34;
                const bz = 38 + Math.cos(boatAngle) * 14;
                const nextBx = Math.sin(boatAngle + 0.02) * 34;
                const nextBz = 38 + Math.cos(boatAngle + 0.02) * 14;

                sampanBoat.position.set(bx, 0.08 + Math.sin(elapsed * 2.2) * 0.06, bz);
                sampanBoat.lookAt(nextBx, sampanBoat.position.y, nextBz);
                sampanBoat.rotateY(-Math.PI / 2);
                sampanBoat.rotation.z = Math.sin(elapsed * 1.8) * 0.04;
            }

            // 4. מעוף הדרקון הסיני המתפתל בין ההרים
            if (showDragon && dragonSegments.length > 0) {
                for (let i = 0; i < dragonSegments.length; i++) {
                    const lag = i * 0.11;
                    const t = elapsed * 0.42 - lag;

                    // מסלול לולאה תלת-ממדי סביב הצוקים והפגודה
                    const dx = Math.sin(t) * 68 + Math.cos(t * 2) * 14;
                    const dy = 48 + Math.sin(t * 2.5) * 14 + Math.cos(t * 1.3) * 6;
                    const dz = -35 + Math.cos(t) * 48;

                    const seg = dragonSegments[i];
                    seg.position.set(dx, dy, dz);

                    // כיוון כל חוליה אל החוליה שלפניה
                    const aheadT = t + 0.06;
                    const ax = Math.sin(aheadT) * 68 + Math.cos(aheadT * 2) * 14;
                    const ay = 48 + Math.sin(aheadT * 2.5) * 14 + Math.cos(aheadT * 1.3) * 6;
                    const az = -35 + Math.cos(aheadT) * 48;
                    seg.lookAt(ax, ay, az);
                }
            }

            // 5. ריחוף פנסי שמיים כלפי מעלה
            if (showLanterns) {
                skyLanterns.forEach(item => {
                    item.mesh.position.y += item.speedY * dt;
                    item.mesh.position.x = item.baseX + Math.sin(elapsed * item.swaySpeed + item.swayOffset) * 2.5;
                    item.mesh.position.z = item.baseZ + Math.cos(elapsed * item.swaySpeed + item.swayOffset) * 2.5;

                    if (item.mesh.position.y > 115) {
                        item.mesh.position.y = 4;
                    }
                });
            }

            // 6. נפילת עלי כותרת של דובדבן ברוח
            if (cherryPetals) {
                const pos = cherryPetals.geometry.attributes.position;
                const phases = cherryPetals.geometry.userData.phases;
                for (let i = 0; i < pos.count; i++) {
                    let py = pos.getY(i) - dt * 2.2;
                    let px = pos.getX(i) + Math.sin(elapsed + phases[i]) * dt * 1.8;
                    if (py < 0.2) py = 54;
                    pos.setY(i, py);
                    pos.setX(i, px);
                }
                pos.needsUpdate = true;
            }

            // 7. זרימת חלקיקי המפלים
            if (waterfallParticles) {
                const pos = waterfallParticles.geometry.attributes.position;
                const vels = waterfallParticles.geometry.userData.velocities;
                const falls = waterfallParticles.geometry.userData.falls;
                for (let i = 0; i < pos.count; i++) {
                    const fall = falls[i % falls.length];
                    let py = pos.getY(i) - vels[i] * dt;
                    if (py < 0) py = fall.h;
                    pos.setY(i, py);
                }
                pos.needsUpdate = true;
            }

            // 8. תנועת ערפל איטית בעמק
            if (mistParticles) {
                mistParticles.rotation.y = Math.sin(elapsed * 0.05) * 0.08;
            }

            renderer.render(scene, camera);
        }

        // הפעלת העולם עם טעינת החלון
        window.onload = init;
    </script>
